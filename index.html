<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature for Life - Upload Image</title>
    
    <!-- Google Fonts za Kisasa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #15803d;
            --primary-hover: #166534;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --bg-main: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #dcfce7;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 90px;
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--primary);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container & Upload Section */
        .container {
            max-width: 600px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .upload-card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .upload-card h2 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .upload-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* Drag and Drop File Input Area */
        .file-drop-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            border: 2px dashed #bbf7d0;
            background-color: #f8fafc;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .file-drop-area:hover {
            border-color: var(--primary);
            background-color: #f0fdf4;
        }

        .file-drop-area input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .file-msg {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .file-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Preview Image Container */
        .image-preview {
            display: none;
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .nav-item.active {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon">🌿</div>
            <span>Nature for Life</span>
        </div>
    </nav>

    <main class="container">
        <section class="upload-card">
            <h2>Shiriki Picha ya Asili 📸</h2>
            <p>Ongeza picha yako ili jamii ya Nature for Life iweze kuiona na kuipigia kura.</p>

            <form id="uploadForm">
                <!-- Sehemu ya Kuchagua Picha -->
                <div class="file-drop-area" id="dropArea">
                    <span class="upload-icon">📁</span>
                    <span class="file-msg" id="fileMsg">Bonyeza hapa au buruta picha yako</span>
                    <span class="file-hint">Inakubali JPG, PNG au WEBP (Max 10MB)</span>
                    <input type="file" id="imageInput" accept="image/*" required>
                </div>

                <!-- Preview ya Picha pindi ikichaguliwa -->
                <img id="imagePreview" class="image-preview" alt="Picha Iliyochaguliwa">

                <!-- Title Input -->
                <div class="form-group">
                    <label for="title">Kichwa cha Picha (Title)</label>
                    <input type="text" id="title" class="form-control" placeholder="Mfano: Mmachungwa Mlimani" required>
                </div>

                <!-- Location Input -->
                <div class="form-group">
                    <label for="location">Mahali/Eneo (Location)</label>
                    <input type="text" id="location" class="form-control" placeholder="Mfano: Lushoto, Tanga" required>
                </div>

                <!-- Description Input -->
                <div class="form-group">
                    <label for="description">Maelezo Mafupi (Description)</label>
                    <textarea id="description" class="form-control" placeholder="Andika maelezo mafupi kuhusu mazingira haya..."></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Pakia Picha Sasa 🚀</button>
            </form>
        </section>
    </main>

    <!-- Bottom Mobile Nav -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item">
            <span>🏠</span>
            <span>Nyumbani</span>
        </a>
        <a href="#" class="nav-item">
            <span>🔍</span>
            <span>Gundua</span>
        </a>
        <a href="#" class="nav-item active">
            <span>➕</span>
            <span>Weka Picha</span>
        </a>
        <a href="#" class="nav-item">
            <span>👤</span>
            <span>Akaunti</span>
        </a>
    </nav>

    <!-- JavaScript kwa ajili ya Preview na Handling -->
    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const fileMsg = document.getElementById('fileMsg');

        // Onyesha picha pindi mtumiaji anapochagua faili
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    fileMsg.textContent = 'Imechaguliwa: ' + file.name;
                }
                reader.readAsDataURL(file);
            }
        });

        // Kuzuia form isirefresh ukurasa ikibonyezwa (Tutaunganisha na backend baadaye)
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Picha yako ipo tayari kutumwa! Hatua inayofuata ni kuunganisha na Backend/Database.');
        });
    </script>
</body>
</html>

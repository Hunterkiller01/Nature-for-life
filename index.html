<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature for Life - Pi App</title>
    
    <!-- HAPA NDIPO CSS INAPOANZA -->
    <style>
        /* Mipangilio ya msingi ya ukurasa mzima */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0fdf4; /* Rangi ya kijani laini sana */
            color: #166534; /* Rangi ya kijani kibichi iliyoiva */
            text-align: center;
        }

        /* Mipangilio ya Kichwa cha Juu (Header) */
        header {
            background-color: #15803d; /* Kijani kibichi kilichokolea */
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        p.subtitle {
            margin: 5px 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Mipangilio ya Sehemu Kuu (Main Content) */
        main {
            padding: 40px 20px;
        }

        .welcome-section {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Mipangilio ya Kitufe (Button) */
        .btn-share {
            display: inline-block;
            background-color: #f97316; /* Rangi ya machungwa (orange) inayovutia */
            color: white;
            padding: 15px 30px;
            margin-top: 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .btn-share:hover {
            background-color: #ea580c; /* Rangi iliyokolea zaidi wakati panya imepita */
            transform: translateY(-2px); /* Kitufe kinaruka kidogo */
        }
    </style>
    <!-- HAPA NDIPO CSS INAPOISHIA -->
    
</head>
<body>

    <header>
        <h1>Nature for Life</h1>
        <p class="subtitle">Shiriki na gundua picha za asili</p>
    </header>

    <main>
        <section class="welcome-section">
            <h2>Karibu Kwenye App Yako ya Asili</h2>
            <p>Huu ni mwanzo tu! Kwenye app hii, utaweza kushiriki picha nzuri za asili, kugundua mandhari mpya, na kuungana na wapenzi wengine wa asili duniani kote kupitia Pi Network.</p>
            
            <a href="#" class="btn-share">Shiriki Picha Sasa</a>
        </section>
    </main>

</body>
</html>
